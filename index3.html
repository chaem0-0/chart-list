<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chart Library Demo Index</title>
    <script src="https://cdn.amcharts.com/lib/5/index.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/xy.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/themes/Animated.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; overflow: hidden; }
        /* 좌측 사이드바 스타일 */
        #sidebar { width: 250px; background: #2c3e50; color: white; padding: 20px; flex-shrink: 0; }
        #sidebar h2 { font-size: 1.2rem; border-bottom: 1px solid #555; padding-bottom: 10px; }
        .menu-group { margin-bottom: 20px; }
        .menu-group h3 { font-size: 0.9rem; color: #95a5a6; text-transform: uppercase; }
        button { 
            display: block; width: 100%; padding: 10px; margin-bottom: 5px; 
            background: #34495e; color: white; border: none; border-radius: 4px; 
            text-align: left; cursor: pointer; transition: 0.3s;
        }
        button:hover { background: #1abc9c; }
        button.active { background: #1abc9c; font-weight: bold; }

        /* 우측 차트 영역 스타일 */
        #content { flex-grow: 1; padding: 20px; background: #f8f9fa; position: relative; }
        #chartdiv { width: 100%; height: 100%; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .info { margin-bottom: 10px; color: #666; font-size: 0.9rem; }
    </style>
</head>
<body>

<div id="sidebar">
    <h2>Chart Index</h2>
    
    <div class="menu-group">
        <h3>Apache ECharts</h3>
        <button onclick="loadChart('echart_stack_bar', this)">Stacked Bar (Y-Category)</button>
        <button onclick="loadChart('echart_line', this)">Basic Line Chart</button>
    </div>

    <div class="menu-group">
        <h3>amCharts 5</h3>
        <button onclick="loadChart('am_clustered_bar', this)">Clustered Bar Chart</button>
        <button onclick="loadChart('am_pie', this)">Animated Pie Chart</button>
        <button onclick="loadChart('am_xy_line', this)">Smooth Line Chart</button>
    </div>
</div>

<div id="content">
    <div class="info" id="chart-info">버튼을 클릭하여 차트를 로드하세요.</div>
    <div id="chartdiv"></div>
</div>

<script>
    let currentRoot = null; // amCharts용 루트 객체 관리
    let currentEChart = null; // ECharts용 인스턴스 관리

    function clearCanvas() {
        // 기존 차트 인스턴스 정리 (메모리 누수 방지)
        if (currentRoot) { currentRoot.dispose(); currentRoot = null; }
        if (currentEChart) { currentEChart.dispose(); currentEChart = null; }
        document.getElementById("chartdiv").innerHTML = "";
    }

    function loadChart(chartType, btn) {
        clearCanvas();
        
        // 버튼 활성화 스타일 처리
        document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('chart-info').innerText = "현재 차트: " + btn.innerText;

        // 선택된 차트 렌더링
        switch(chartType) {
            case 'echart_stack_bar': renderEChartStackBar(); break;
            case 'echart_line': renderEChartLine(); break;
            case 'am_clustered_bar': renderAmClusteredBar(); break;
            case 'am_pie': renderAmPie(); break;
            case 'am_xy_line': renderAmSmoothLine(); break;
        }
    }

    // --- 1. ECharts: Stacked Bar (요청하신 스타일) ---
    function renderEChartStackBar() {
        currentEChart = echarts.init(document.getElementById('chartdiv'));
        const option = {
            tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
            legend: {},
            grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
            xAxis: { type: 'value' },
            yAxis: { type: 'category', data: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'] },
            series: [
                { name: 'Direct', type: 'bar', stack: 'total', data: [320, 302, 301, 334, 390, 330, 320] },
                { name: 'Mail Ad', type: 'bar', stack: 'total', data: [120, 132, 101, 134, 90, 230, 210] }
            ]
        };
        currentEChart.setOption(option);
    }

    // --- 2. ECharts: Basic Line ---
    function renderEChartLine() {
        currentEChart = echarts.init(document.getElementById('chartdiv'));
        currentEChart.setOption({
            xAxis: { type: 'category', data: ['A', 'B', 'C', 'D', 'E'] },
            yAxis: { type: 'value' },
            series: [{ data: [150, 230, 224, 218, 135], type: 'line' }]
        });
    }

    // --- 3. amCharts: Clustered Bar (요청하신 스타일) ---
    function renderAmClusteredBar() {
        let root = am5.Root.new("chartdiv");
        currentRoot = root;
        root.setThemes([am5themes_Animated.new(root)]);

        let chart = root.container.children.push(am5xy.XYChart.new(root, { panX: false, panY: false, wheelX: "panX", wheelY: "zoomX", layout: root.verticalLayout }));
        
        let yAxis = chart.yAxes.push(am5xy.CategoryAxis.new(root, { categoryField: "year", renderer: am5xy.AxisRendererY.new(root, { inversed: true, cellStartLocation: 0.1, cellEndLocation: 0.9 }) }));
        yAxis.data.setAll([{ year: "2021" }, { year: "2022" }, { year: "2023" }]);

        let xAxis = chart.xAxes.push(am5xy.ValueAxis.new(root, { renderer: am5xy.AxisRendererX.new(root, {}) }));

        function createSeries(name, field) {
            let series = chart.series.push(am5xy.ColumnSeries.new(root, { name: name, xAxis: xAxis, yAxis: yAxis, valueXField: field, categoryYField: "year" }));
            series.columns.template.setAll({ tooltipText: "{name}: {valueX}", width: am5.percent(90), strokeOpacity: 0 });
            series.data.setAll([{ year: "2021", v1: 10, v2: 15 }, { year: "2022", v1: 12, v2: 18 }, { year: "2023", v1: 25, v2: 22 }]);
        }
        createSeries("Income", "v1");
        createSeries("Expenses", "v2");
    }

    // --- 4. amCharts: Pie Chart ---
    function renderAmPie() {
        // amCharts Pie 모듈이 추가로 필요하므로 간단한 XY로 대체하거나 라이브러리 추가 필요
        // 여기서는 구조를 위해 XY 차트의 다른 형태인 Smooth Line으로 예시를 추가합니다.
        document.getElementById("chartdiv").innerHTML = "<p style='padding:20px'>amCharts Pie 모듈(percent.js)을 로드하면 구현 가능합니다. (현재 XY 기본 탑재)</p>";
    }

    // --- 5. amCharts: Smooth Line ---
    function renderAmSmoothLine() {
        let root = am5.Root.new("chartdiv");
        currentRoot = root;
        let chart = root.container.children.push(am5xy.XYChart.new(root, {}));
        let xAxis = chart.xAxes.push(am5xy.CategoryAxis.new(root, { categoryField: "date", renderer: am5xy.AxisRendererX.new(root, {}) }));
        let yAxis = chart.xAxes.push(am5xy.ValueAxis.new(root, { renderer: am5xy.AxisRendererY.new(root, {}) }));
        let series = chart.series.push(am5xy.LineSeries.new(root, { name: "Series", xAxis: xAxis, yAxis: yAxis, valueYField: "value", categoryXField: "date" }));
        series.data.setAll([{date: "1", value: 10}, {date: "2", value: 15}, {date: "3", value: 5}]);
    }

    // 초기 화면 로드
    window.onload = () => {
        document.querySelector('button').click();
    };
</script>

</body>
</html>
