<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chart Library Dashboard</title>
    
    <script src="https://cdn.amcharts.com/lib/5/index.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/xy.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/percent.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/themes/Animated.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    
    <style>
        body { margin: 0; font-family: 'Pretendard', sans-serif; display: flex; height: 100vh; background: #f0f2f5; }
        #sidebar { width: 280px; background: #1a1c23; color: #ecf0f1; padding: 20px; overflow-y: auto; }
        #sidebar h2 { color: #1abc9c; font-size: 1.1rem; margin-bottom: 25px; border-left: 4px solid #1abc9c; padding-left: 10px; }
        .group-label { font-size: 0.75rem; color: #7f8c8d; margin: 15px 0 8px 5px; text-transform: uppercase; letter-spacing: 1px; }
        button { 
            width: 100%; padding: 12px 15px; margin-bottom: 8px; background: #2c3e50; color: #bdc3c7; 
            border: none; border-radius: 6px; text-align: left; cursor: pointer; transition: all 0.2s; 
        }
        button:hover { background: #34495e; color: white; }
        button.active { background: #1abc9c; color: white; box-shadow: 0 4px 15px rgba(26, 188, 156, 0.3); }
        
        #main-content { flex: 1; display: flex; flex-direction: column; padding: 25px; }
        #chart-header { margin-bottom: 15px; }
        #chart-header h1 { margin: 0; font-size: 1.5rem; color: #333; }
        #chartdiv { flex: 1; background: white; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

<div id="sidebar">
    <h2>CHART EXPLORER</h2>
    
    <div class="group-label">Apache ECharts</div>
    <button onclick="changeChart('ec_stack_bar', this)">ECharts: Stacked Bar</button>
    <button onclick="changeChart('ec_pie', this)">ECharts: Nightingale Pie</button>

    <div class="group-label">amCharts 5</div>
    <button onclick="changeChart('am_clustered', this)">amCharts: Clustered Bar</button>
    <button onclick="changeChart('am_pie', this)">amCharts: Animated Pie</button>
    <button onclick="changeChart('am_donut', this)">amCharts: Donut Chart</button>
</div>

<div id="main-content">
    <div id="chart-header">
        <h1 id="chart-title">차트를 선택하세요</h1>
    </div>
    <div id="chartdiv"></div>
</div>

<script>
    let amRoot = null;
    let ecInstance = null;

    function resetCanvas() {
        if (amRoot) { amRoot.dispose(); amRoot = null; }
        if (ecInstance) { ecInstance.dispose(); ecInstance = null; }
        document.getElementById("chartdiv").innerHTML = "";
    }

    function changeChart(type, btn) {
        resetCanvas();
        document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('chart-title').innerText = btn.innerText;

        switch(type) {
            case 'ec_stack_bar': drawEChartStack(); break;
            case 'ec_pie': drawEChartPie(); break;
            case 'am_clustered': drawAmClustered(); break;
            case 'am_pie': drawAmPie(false); break;
            case 'am_donut': drawAmPie(true); break;
        }
    }

    // 1. ECharts: Stacked Bar
    function drawEChartStack() {
        ecInstance = echarts.init(document.getElementById('chartdiv'));
        ecInstance.setOption({
            tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
            legend: { top: '5%' },
            xAxis: { type: 'value' },
            yAxis: { type: 'category', data: ['월', '화', '수', '목', '금'] },
            series: [
                { name: 'Direct', type: 'bar', stack: 'total', data: [320, 302, 301, 334, 390] },
                { name: 'Search', type: 'bar', stack: 'total', data: [120, 132, 101, 134, 90] }
            ]
        });
    }

    // 2. ECharts: Nightingale Pie
    function drawEChartPie() {
        ecInstance = echarts.init(document.getElementById('chartdiv'));
        ecInstance.setOption({
            series: [{
                type: 'pie', radius: [20, 150], roseType: 'area',
                itemStyle: { borderRadius: 8 },
                data: [
                    { value: 40, name: 'Rose 1' }, { value: 38, name: 'Rose 2' },
                    { value: 32, name: 'Rose 3' }, { value: 30, name: 'Rose 4' }
                ]
            }]
        });
    }

    // 3. amCharts: Clustered Bar
    function drawAmClustered() {
        amRoot = am5.Root.new("chartdiv");
        amRoot.setThemes([am5themes_Animated.new(amRoot)]);
        let chart = amRoot.container.children.push(am5xy.XYChart.new(amRoot, { layout: amRoot.verticalLayout }));
        
        let yAxis = chart.yAxes.push(am5xy.CategoryAxis.new(amRoot, { 
            categoryField: "year", renderer: am5xy.AxisRendererY.new(amRoot, { inversed: true }) 
        }));
        yAxis.data.setAll([{year:"2023"}, {year:"2024"}]);

        let xAxis = chart.xAxes.push(am5xy.ValueAxis.new(amRoot, { renderer: am5xy.AxisRendererX.new(amRoot, {}) }));

        function makeSeries(name, field) {
            let series = chart.series.push(am5xy.ColumnSeries.new(amRoot, { 
                name: name, xAxis: xAxis, yAxis: yAxis, valueXField: field, categoryYField: "year" 
            }));
            series.data.setAll([{year:"2023", v1:50, v2:40}, {year:"2024", v1:60, v2:80}]);
        }
        makeSeries("Sales", "v1");
        makeSeries("Profit", "v2");
    }

    // 4 & 5. amCharts: Pie & Donut (percent.js 모듈 사용)
    function drawAmPie(isDonut) {
        amRoot = am5.Root.new("chartdiv");
        amRoot.setThemes([am5themes_Animated.new(amRoot)]);
        
        let chart = amRoot.container.children.push(am5percent.PieChart.new(amRoot, {
            layout: amRoot.verticalLayout,
            innerRadius: isDonut ? am5.percent(50) : 0 // 도넛 여부 결정
        }));

        let series = chart.series.push(am5percent.PieSeries.new(amRoot, {
            valueField: "value",
            categoryField: "category",
            alignLabels: true
        }));

        series.data.setAll([
            { category: "Research", value: 1000 },
            { category: "Marketing", value: 800 },
            { category: "Sales", value: 600 },
            { category: "Ops", value: 400 }
        ]);

        series.appear(1000, 100);
    }

    window.onload = () => document.querySelector('button').click();
</script>
</body>
</html>
